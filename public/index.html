<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>世界旅人打卡地圖</title>
  
  <!-- Leaflet 地圖樣式庫 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- 繁簡中文轉換庫 (OpenCC) -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/bundle-node.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }
    #map {
      height: 100vh;
      width: 100%;
    }

    /* 頂部視角切換列 */
    .control-panel {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
      padding: 6px;
      border-radius: 30px;
      display: flex;
      gap: 6px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #64748b;
    }

    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
    }

    /* 左下角資訊與暱稱設定徽章 */
    .badge {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(4px);
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
      font-size: 13px;
      color: #334155;
      line-height: 1.5;
    }

    .edit-name-btn {
      margin-left: 8px;
      color: #2563eb;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      text-decoration: underline;
    }

    /* 自訂地圖彈窗樣式 */
    .custom-popup-title {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
    }
    .custom-popup-user {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .custom-popup-msg {
      font-size: 13px;
      color: #1e293b;
      line-height: 1.4;
    }

    /* 打卡彈窗遮罩與外框 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      backdrop-filter: blur(3px);
    }
    .modal-overlay.hidden {
      display: none;
    }
    .modal-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-header h3 {
      margin: 0 0 4px 0;
      font-size: 1.25rem;
      color: #1e293b;
    }
    .modal-location {
      font-size: 0.9rem;
      color: #64748b;
      font-weight: 500;
    }
    
    /* 色票選擇器 */
    .color-picker-label {
      font-size: 0.85rem;
      color: #475569;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .color-options {
      display: flex;
      gap: 12px;
    }
    .color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .color-dot:hover {
      transform: scale(1.15);
    }
    .color-dot.active {
      border-color: #0f172a;
      transform: scale(1.2);
    }

    /* 輸入框與操作按鈕 */
    .modal-textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      resize: none;
      font-size: 0.9rem;
      box-sizing: border-box;
      outline: none;
    }
    .modal-textarea:focus {
      border-color: #2563eb;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn-cancel {
      background: #f1f5f9;
      color: #475569;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-submit {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- 視角切換按鈕 -->
  <div class="control-panel">
    <button id="btn-all" class="tab-btn active" onclick="switchView('all')">🌍 全球旅人地圖</button>
    <button id="btn-my" class="tab-btn" onclick="switchView('my')">📍 我的足跡地圖</button>
  </div>

  <!-- 打卡統計與使用者身分資訊 -->
  <div class="badge" id="stats-badge">載入中...</div>

  <!-- 地圖容器 -->
  <div id="map"></div>
  
  <!-- 打卡彈窗 Modal -->
  <div id="checkinModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>📍 新增足跡打卡</h3>
        <div id="modalLocationText" class="modal-location">地點載入中...</div>
      </div>

      <div>
        <div class="color-picker-label">選擇地標顏色</div>
        <div class="color-options">
          <div class="color-dot active" data-color="#2563eb" style="background: #2563eb;"></div>
          <div class="color-dot" data-color="#ef4444" style="background: #ef4444;"></div>
          <div class="color-dot" data-color="#10b981" style="background: #10b981;"></div>
          <div class="color-dot" data-color="#f59e0b" style="background: #f59e0b;"></div>
          <div class="color-dot" data-color="#8b5cf6" style="background: #8b5cf6;"></div>
        </div>
      </div>

      <textarea id="modalMessageInput" class="modal-textarea" placeholder="寫下你在這裡的故事或心得（選填）..."></textarea>

      <div class="modal-actions">
        <button id="modalCancelBtn" class="btn-cancel">取消</button>
        <button id="modalSubmitBtn" class="btn-submit">確認打卡</button>
      </div>
    </div>
  </div>

  <!-- Leaflet 核心 JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. 安全初始化繁體轉換器
    let toTraditional = (text) => text;
    try {
      if (window.OpenCC) {
        toTraditional = OpenCC.Converter({ from: 'cn', to: 'tw' });
      }
    } catch (e) {
      console.warn('OpenCC 繁簡庫載入略過，使用原文字串');
    }

    // 2. 初始化使用者身分 (localStorage)
    let currentUserId = localStorage.getItem('world_map_user_id');
    if (!currentUserId) {
      currentUserId = 'user_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('world_map_user_id', currentUserId);
    }

    let currentUserName = localStorage.getItem('world_map_user_name') || '';
    let currentView = 'all';
    let allCheckins = [];

    // 3. 初始化地圖
    const map = L.map('map', {
      center: [23.5, 121],
      zoom: 3,
      minZoom: 2,
      maxBounds: [[-90, -180], [90, 180]],
      maxBoundsViscosity: 1.0
    });

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      noWrap: true,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);

    setTimeout(() => {
      map.invalidateSize();
    }, 200);

    // 建立彩色 SVG Pin
    function createPinIcon(color = '#2563eb') {
      return L.divIcon({
        className: 'custom-pin',
        html: `
          <svg width="28" height="38" viewBox="0 0 24 36" style="filter: drop-shadow(0 2px 5px rgba(0,0,0,0.35));">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 24 12 24s12-15 12-24c0-6.63-5.37-12-12-12z" fill="${color}"/>
            <circle cx="12" cy="12" r="4.5" fill="#ffffff"/>
          </svg>
        `,
        iconSize: [28, 38],
        iconAnchor: [14, 38],
        popupAnchor: [0, -34]
      });
    }

    // 4. 繪製標記至地圖與更新狀態列
    function renderMarkers() {
      markersLayer.clearLayers();

      const filtered = (currentView === 'my')
        ? allCheckins.filter(item => item.userId === currentUserId)
        : allCheckins;

      filtered.forEach(item => {
        const isMine = item.userId === currentUserId;
        const popupContent = `
          <div>
            <div class="custom-popup-title">📍 ${escapeHtml(item.country)} · ${escapeHtml(item.city)}</div>
            <div class="custom-popup-user" style="color: ${item.color || '#2563eb'};">
              ${escapeHtml(item.user)} ${isMine ? '(我)' : ''}
            </div>
            <div class="custom-popup-msg">${escapeHtml(item.message || '無打卡留言')}</div>
            ${isMine ? `
              <div style="margin-top: 8px; text-align: right;">
                <button 
                  onclick="handleDeleteCheckin('${item.id}')"
                  style="background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer;">
                  刪除打卡
                </button>
            </div>
          ` : ''}
        </div>
      `;
        L.marker([item.lat, item.lng], { icon: createPinIcon(item.color) })
          .addTo(markersLayer)
          .bindPopup(popupContent);
      });

      const myCount = allCheckins.filter(item => item.userId === currentUserId).length;
      const displayName = currentUserName ? escapeHtml(currentUserName) : '未設定 (點擊打卡將自動設定)';
      
      const statsText = currentView === 'my' 
        ? `🚩 我的足跡：共 <b>${myCount}</b> 個地點`
        : `🌍 全球打卡：<b>${allCheckins.length}</b> 筆（我的打卡：${myCount} 筆）`;

      document.getElementById('stats-badge').innerHTML = `
        <div>${statsText}</div>
        <div style="font-size: 12px; color: #64748b; margin-top: 4px;">
          👤 當前旅人：<b>${displayName}</b>
          ${currentUserName ? `<button class="edit-name-btn" onclick="changeNickname()">修改</button>` : ''}
        </div>
      `;
    }

    // 5. 切換視角模式
    function switchView(view) {
      currentView = view;
      document.getElementById('btn-all').classList.toggle('active', view === 'all');
      document.getElementById('btn-my').classList.toggle('active', view === 'my');
      renderMarkers();
    }

    // 6. 手動修改暱稱並同步更新過去所有打卡紀錄
    async function changeNickname() {
      const newName = prompt('請輸入新的旅人暱稱：', currentUserName);
      if (!newName || !newName.trim() || newName.trim() === currentUserName) return;

      const trimmedName = newName.trim();

      try {
        const res = await fetch(`/api/checkins/user/${currentUserId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user: trimmedName })
        });

        if (res.ok) {
          currentUserName = trimmedName;
          localStorage.setItem('world_map_user_name', currentUserName);

          allCheckins.forEach(item => {
            if (item.userId === currentUserId) {
              item.user = currentUserName;
            }
          });

          renderMarkers();
        } else {
          alert('暱稱同步失敗，請稍後再試！');
        }
      } catch (err) {
        console.error('更新暱稱失敗:', err);
        alert('網路連線異常，無法同步暱稱');
      }
    }

    // 7. 載入伺服器打卡資料
    async function loadData() {
      try {
        const res = await fetch('/api/checkins');
        allCheckins = await res.json();
        renderMarkers();
      } catch (err) {
        console.error('載入打卡資料失敗:', err);
      }
    }

    // 8. 彈窗元素綁定與色票切換邏輯
    const modal = document.getElementById('checkinModal');
    const modalLocationText = document.getElementById('modalLocationText');
    const modalMessageInput = document.getElementById('modalMessageInput');
    const modalCancelBtn = document.getElementById('modalCancelBtn');
    const modalSubmitBtn = document.getElementById('modalSubmitBtn');
    const colorDots = document.querySelectorAll('.color-dot');

    let pendingCheckin = null;
    let selectedColor = '#2563eb';

    colorDots.forEach(dot => {
      dot.addEventListener('click', () => {
        colorDots.forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        selectedColor = dot.getAttribute('data-color');
      });
    });

    modalCancelBtn.addEventListener('click', () => {
      modal.classList.add('hidden');
      pendingCheckin = null;
    });

    // 點擊地圖打卡事件
      map.on('click', async (e) => {
  // ✅ 使用 .wrap() 自動將經度限制在 -180 到 +180 的合法地球座標內
      const wrappedLatLng = e.latlng.wrap();
      const lat = wrappedLatLng.lat;
      const lng = wrappedLatLng.lng;

      if (!currentUserName) {
        const inputName = prompt('歡迎初次打卡！請先設定您的旅人暱稱：', '台灣旅人');
        if (!inputName || !inputName.trim()) return;
        currentUserName = inputName.trim();
        localStorage.setItem('world_map_user_name', currentUserName);
        renderMarkers();
      }

      // 先打開彈窗
      pendingCheckin = { lat, lng, country: "查詢中...", city: "查詢中..." };
      modalLocationText.textContent = `📍 正在反查地點... ｜ 👤 旅人：${currentUserName}`;
      modalMessageInput.value = '';
      modal.classList.remove('hidden');
      modalMessageInput.focus();

      let country = "未知國家";
      let city = "未知地點";

      try {
        // 👉 改呼叫自己的後端代理 API，穩定且不被 OSM 阻擋
        const geoRes = await fetch(`/api/geocode/reverse?lat=${lat}&lng=${lng}`);
        if (geoRes.ok) {
          const geoData = await geoRes.json();
          country = toTraditional(geoData.country || "未知國家");
          city = toTraditional(geoData.city || "未知地點");
        }
      } catch (err) {
        console.warn('反查地點失敗:', err);
      }

      // 更新彈窗
      pendingCheckin = { lat, lng, country, city };
      modalLocationText.textContent = `📍 ${country} · ${city} ｜ 👤 旅人：${currentUserName}`;
      // 👉 請確認 map.on('click') 下方是否有這段確認按鈕監聽：
    modalSubmitBtn.onclick = async () => {
      if (!pendingCheckin || modalSubmitBtn.disabled) return;

      // 1. 立即停用按鈕防止連點
      modalSubmitBtn.disabled = true;
      modalSubmitBtn.textContent = '儲存中...';

      const message = modalMessageInput.value.trim();

      try {
        const res = await fetch('/api/checkins', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: currentUserId,
            lat: pendingCheckin.lat,
            lng: pendingCheckin.lng,
            country: pendingCheckin.country,
            city: pendingCheckin.city,
            user: currentUserName || '匿名旅人',
            message: message,
            color: selectedColor || '#2563eb'
          })
        });

        if (res.ok) {
          const newPoint = await res.json();
          allCheckins.push(newPoint);
          renderMarkers();
          
          modal.classList.add('hidden');
          pendingCheckin = null;
        } else {
          alert('打卡失敗，請稍後再試');
        }
      } catch (err) {
        console.error('打卡儲存失敗:', err);
      } finally {
        // 2. 恢復按鈕狀態
        modalSubmitBtn.disabled = false;
        modalSubmitBtn.textContent = '確認打卡';
      }
    };
    });

    async function handleDeleteCheckin(id) {
      if (!confirm('確定要刪除這筆打卡紀錄嗎？')) return;

      const currentUserId = localStorage.getItem('world_map_user_id');

      try {
        const res = await fetch(`/api/checkins/${id}`, {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ userId: currentUserId })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error || '刪除失敗');
        }

        alert('打卡已刪除！');
        location.reload();
      } catch (err) {
        console.error('刪除失敗:', err);
        alert(`刪除失敗：${err.message}`);
      }
    }
    window.handleDeleteCheckin = handleDeleteCheckin;


    // 簡易 XSS 防護
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    loadData();
  </script>
</body>
</html>
